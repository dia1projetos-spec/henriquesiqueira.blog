<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Admin · Henrique Siqueira</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">

<div class="login-page">

  <!-- ═══ LEFT — decorativa ═══ -->
  <div class="login-left" aria-hidden="true">
    <div class="login-left-grid"></div>
    <div class="login-left-content">
      <div class="login-monogram">HS</div>
      <p class="login-left-quote">
        "A dúvida é o princípio da sabedoria."
      </p>
      <span class="login-left-author">— Aristóteles</span>
    </div>
  </div>

  <!-- ═══ RIGHT — formulário ═══ -->
  <div class="login-right">
    <a href="/" class="login-back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Voltar ao blog
    </a>

    <div class="login-eyebrow">
      <span class="login-eyebrow-dot"></span>
      Área restrita
    </div>

    <h1 class="login-heading">
      Área<br/>Administrativa
    </h1>
    <p class="login-subtext">Acesso exclusivo ao autor.</p>

    <div id="loginError" class="login-error-box" style="display:none;" role="alert">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="loginErrorMsg"></span>
    </div>

    <div class="login-form">
      <div class="form-field">
        <label for="email" class="field-label">E-mail</label>
        <div class="field-input-wrap">
          <input
            type="email" id="email"
            class="field-input"
            placeholder="seu@email.com"
            autocomplete="email"
            inputmode="email"
          />
        </div>
      </div>

      <div class="form-field">
        <label for="password" class="field-label">Senha</label>
        <div class="field-input-wrap">
          <input
            type="password" id="password"
            class="field-input"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>
      </div>

      <button class="login-submit" id="loginBtn" type="button">
        <span id="loginBtnText">Entrar</span>
        <div class="f-spinner" id="loginSpinner" style="display:none;" aria-hidden="true"></div>
      </button>
    </div>
  </div>

</div>

<script type="module" src="../js/login.js"></script>
</body>
</html>
